<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Zonacomex</title>
  
  <!-- Estilos CSS -->
  <link rel="stylesheet" href="style1.css">
  
  <!-- Íconos de FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>

  <nav>
    <input type="checkbox" id="check">
    <label for="check" class="checkbtn">
      <i class="fa-solid fa-bars"></i>
    </label>

    <a href="index.html" class="enlace">
      <img src="imagenes/logo.jpg" alt="Logo Zonacomex" class="logo">
    </a>

    <ul>
      <li><a href="index.html">Inicio</a></li>
      <li><a href="menu_responsive_repositorioStyle1.html">Repositorio</a></li>
      <li><a href="menu_responsive_serviciosStyle1.html">Servicios</a></li>
      <li><a href="menu_responsive_registroStyle1.html">Registro</a></li>
      <li><a href="#">Español</a></li>
      <li><a href="#">English</a></li>
    </ul>
  </nav>

  <section>
    <form name="miformulario" id="miformulario" action="/api/login" method="POST" autocomplete="on">
      <table> 
        <tr>
          <td>
            <h2 id="titulo3">Ingresa a tu cuenta</h2>
          </td>
        </tr>

        <tr>
          <td>
            <input class="celda" type="text" name="nombre" id="nombre" placeholder="Ingrese su Nombre" required autofocus>
          </td>
        </tr>

        <tr>
          <td>
            <input class="celda" type="text" name="apellido" id="apellido" placeholder="Ingrese su Apellido" required>
          </td>
        </tr>

        <tr>
          <td>
            <input class="celda" type="email" name="email" id="email" placeholder="Ingrese su Email" required>
          </td>
        </tr>

        <tr>
          <td>
            <input class="celda" type="password" name="contrasena" id="contrasena" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,8}" placeholder="Ingrese una contraseña" title="Ingrese una contraseña de 8 caracteres que contenga a lo menos un número, una letra mayúscula y una letra minúscula" required ondblclick="muestraContrasena()">
          </td>
        </tr>
        
        <tr>
          <td>
            <input type="checkbox" name="verContrasena" id="verContrasena" onclick="muestraContrasena()">
            <label for="verContrasena" id="verContrasenaTag">Ver contraseña <i class="fa fa-eye"></i></label>
          </td>
        </tr>

        <tr>
          <td>
            <input class="casilla" type="checkbox" name="casilla" id="casilla" required>
            <label for="casilla" id="casilla2">Estoy de acuerdo con <a href="#">Términos y condiciones</a></label>
          </td>
        </tr>

        <tr>
          <td>
            <input class="boton" type="submit" name="boton" id="boton" value="Iniciar sesión">
          </td>
        </tr>
      </table>
    </form>

    <br>
    <p id="cuentaprevia"><a href="menu_responsive_registroStyle1.html">&iquest;No tienes una cuenta? Regístrate aquí</a></p>
    <p id="fechacorta">Fecha de hoy: <span id="fechaActual"></span></p>

    <script>
      // Fecha actual dinámica
      document.getElementById('fechaActual').textContent = new Date().toDateString();

      // Mostrar / ocultar contraseña
      const muestraContrasena = () => {
        let input = document.querySelector("#contrasena");
        input.type = input.type === "password" ? "text" : "password";
      };

      // Envío de formulario de inicio de sesión
      document.getElementById('miformulario').addEventListener('submit', async (event) => {
        event.preventDefault();

        const datosLogin = {
          email: document.getElementById('email').value,
          contrasena: document.getElementById('contrasena').value
        };

        try {
          const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(datosLogin)
          });

          const resultado = await response.json();

          if (response.ok && resultado.success) {
            alert('¡Inicio de sesión exitoso!');
          } else {
            alert(`Error: ${resultado.error || 'Credenciales incorrectas'}`);
          }
        } catch (error) {
          console.error('Error al conectar con el servidor:', error);
          alert('No se pudo conectar con el servidor backend.');
        }
      });
    </script>
  </section>

</body>
</html>
